body:
  - type: markdown
    attributes:
      value: |
        Une question sur l'installation, la calibration ou un réglage ? Posez-la ici.
        Pensez à consulter le [README](https://github.com/Jul1111/Auto-Dofus-Price-Update#readme) et le [guide d'utilisation](https://github.com/Jul1111/Auto-Dofus-Price-Update/blob/main/docs/GUIDE.md) : la réponse y est peut-être déjà.
        Si l'outil fait quelque chose d'anormal, la catégorie **Bugs** est plus adaptée.
  - type: textarea
    id: question
    attributes:
      label: Votre question
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: Contexte (optionnel)
      description: Version de l'outil, résolution, ce que vous avez déjà essayé…
