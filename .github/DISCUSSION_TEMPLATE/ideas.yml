title: "[Idée] "
body:
  - type: markdown
    attributes:
      value: |
        Une idée pour améliorer l'outil ? Décrivez le besoin avant la solution : c'est ce qui aide le plus à trouver la bonne façon de faire.
        Votez pour les idées des autres avec 👍 : cela aide à choisir quoi faire en premier.
  - type: textarea
    id: besoin
    attributes:
      label: Le besoin
      description: Qu'est-ce qui vous manque ou vous gêne aujourd'hui ?
      placeholder: "Quand je vends des ressources en grande quantité, je dois…"
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: L'idée
      description: Comment vous imaginez la solution (raccourci, option, onglet…).
    validations:
      required: true
  - type: checkboxes
    id: aide
    attributes:
      label: Participation
      options:
        - label: Je veux bien essayer une version de test
        - label: Je veux bien proposer le code (pull request)
